# Deploy to Azure Web App using AZURE_CREDENTIALS (service principal)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Login to Azure using service principal
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Install dependencies (optional for CI tests)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: (optional) Run tests
        run: |
          # add tests here if you have them, e.g. pytest
          echo "No tests configured"

      - name: Package artifact (zip)
        run: |
          # Create a zip artifact for deployment and exclude .git, local venvs, and CI-only folders
          zip -r release.zip . -x ".git/*" ".venv/*" ".github/*" "tests/*" "__pycache__/*"

      - name: Deploy with Azure CLI (zip)
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path release.zip \
            --type zip

      - name: Confirm deployment / show default host
        run: |
          az webapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AZURE_WEBAPP_NAME }}" --query "{name:name, state:state, defaultHostName:defaultHostName}" -o json