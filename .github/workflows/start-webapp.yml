name: Start Web App (trading hours)

on:
  # schedule:
  #   # Morning start: 01:30 UTC (08:30 VN) Mon-Fri
  #   - cron: '30 1 * * MON-FRI'
  #   # Afternoon start: 05:45 UTC (12:45 VN) Mon-Fri
  #   - cron: '45 5 * * MON-FRI'
  workflow_dispatch: {}

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start Web App
        run: |
          az webapp start --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AZURE_WEBAPP_NAME }}"
